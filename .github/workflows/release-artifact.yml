name: Release artifact

# NOTE: This workflow is PREVIEW-ONLY as of v0.2.0.
#
# It builds an unsigned Release Spotiglass.app and uploads it as a 14-day
# Actions artifact so reviewers can grab a build of a branch without a Mac.
# It does NOT cut a real release.
#
# Real releases are cut locally from a maintainer's Mac via:
#   ./scripts/sparkle-release.sh <marketing_version> <build_number> docs/release-notes/v<version>.md
#
# The local script embeds the SpotiglassEQDriver into the .app and re-signs
# it with the maintainer's Apple Development identity (coreaudiod on macOS 26
# rejects ad-hoc-signed HAL plugins). CI doesn't have access to that signing
# identity, so the Sparkle archive + GitHub Release + appcast publish steps
# were removed — running them here would publish a working app shell with a
# broken EQ to all existing 0.x users.

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version (e.g. 0.2.0)"
        required: true
        type: string
      build_number:
        description: "CFBundleVersion build number (must increase; default = run number)"
        required: false
        type: string

jobs:
  build:
    name: Build unsigned Release Spotiglass.app (preview only)
    # Pinned to the macos-26 (Tahoe) runner because Spotiglass and
    # SpotiglassTests both have a macOS 26.0 deployment target. The default
    # macos-latest label currently maps to macOS 15, whose host OS (15.7.x)
    # is older than the deployment target, so xcodebuild test refuses to
    # launch the test runner with: "My Mac's macOS 15.7.4 doesn't match
    # SpotiglassTests's macOS 26.0 deployment target." macos-26 went GA on
    # 2026-02-26 and includes Xcode 26.x by default.
    # See: https://github.com/actions/runner-images/issues/13739
    runs-on: macos-26
    timeout-minutes: 45
    env:
      PROJECT: Spotiglass.xcodeproj
      SCHEME: Spotiglass
      CONFIGURATION: Release
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      MARKETING_VERSION: ${{ inputs.marketing_version }}
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-path --sdk macosx
          xcrun --show-sdk-version --sdk macosx
          echo "Preview build: ${MARKETING_VERSION} (${BUILD_NUMBER})"

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Run unit tests with coverage
        id: unit_tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -parallel-testing-enabled NO \
            -enableCodeCoverage YES \
            -resultBundlePath "$GITHUB_WORKSPACE/build/ci-cov.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload test result bundle on failure
        if: failure() && steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-xcresult-${{ github.run_id }}
          path: build/ci-cov.xcresult
          if-no-files-found: error
          retention-days: 14

      - name: Per-file coverage gate (allowlisted ramp-up)
        run: |
          set -euo pipefail
          COVERAGE_ALLOWLIST=scripts/coverage-allowlist.json \
            ./scripts/check-coverage-per-file.sh "$GITHUB_WORKSPACE/build/ci-cov.xcresult"

      - name: Build unsigned Release Spotiglass.app
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Stage Spotiglass.app in artifact folder
        run: |
          set -euo pipefail
          APP_SOURCE="$DERIVED_DATA/Build/Products/$CONFIGURATION/Spotiglass.app"
          if [ ! -d "$APP_SOURCE" ]; then
            echo "Spotiglass.app not found at $APP_SOURCE" >&2
            ls -la "$DERIVED_DATA/Build/Products/$CONFIGURATION/" || true
            exit 1
          fi
          ARTIFACT_DIR="$GITHUB_WORKSPACE/artifact"
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          cp -R "$APP_SOURCE" "$ARTIFACT_DIR/Spotiglass.app"
          file "$ARTIFACT_DIR/Spotiglass.app/Contents/MacOS/Spotiglass"
          codesign -dv "$ARTIFACT_DIR/Spotiglass.app" 2>&1 || true
          echo ""
          echo "NOTE: this preview build does NOT contain SpotiglassEQDriver.driver."
          echo "Cut a real release locally via ./scripts/sparkle-release.sh."

      - name: Upload Spotiglass.app artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: Spotiglass-release-app
          path: artifact/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
