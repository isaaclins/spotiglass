name: Release artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned Release Spotiglass.app
    # Pinned to the macos-26 (Tahoe) runner because Spotiglass and
    # SpotiglassTests both have a macOS 26.0 deployment target. The default
    # macos-latest label currently maps to macOS 15, whose host OS (15.7.x)
    # is older than the deployment target, so xcodebuild test refuses to
    # launch the test runner with: "My Mac's macOS 15.7.4 doesn't match
    # SpotiglassTests's macOS 26.0 deployment target." macos-26 went GA on
    # 2026-02-26 and includes Xcode 26.x by default.
    # See: https://github.com/actions/runner-images/issues/13739
    runs-on: macos-26
    timeout-minutes: 45
    env:
      PROJECT: Spotiglass.xcodeproj
      SCHEME: Spotiglass
      CONFIGURATION: Release
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-path --sdk macosx
          xcrun --show-sdk-version --sdk macosx

      - name: Run unit tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build unsigned Release Spotiglass.app
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Stage Spotiglass.app in artifact folder
        run: |
          set -euo pipefail
          APP_SOURCE="$DERIVED_DATA/Build/Products/$CONFIGURATION/Spotiglass.app"
          if [ ! -d "$APP_SOURCE" ]; then
            echo "Spotiglass.app not found at $APP_SOURCE" >&2
            ls -la "$DERIVED_DATA/Build/Products/$CONFIGURATION/" || true
            exit 1
          fi
          ARTIFACT_DIR="$GITHUB_WORKSPACE/artifact"
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          cp -R "$APP_SOURCE" "$ARTIFACT_DIR/Spotiglass.app"
          file "$ARTIFACT_DIR/Spotiglass.app/Contents/MacOS/Spotiglass"
          codesign -dv "$ARTIFACT_DIR/Spotiglass.app" 2>&1 || true

      - name: Upload Spotiglass.app artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: Spotiglass-release-app
          path: artifact/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
