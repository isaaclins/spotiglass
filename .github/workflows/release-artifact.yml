name: Release artifact

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version (e.g. 0.2.0)"
        required: true
        type: string
      build_number:
        description: "CFBundleVersion build number (must increase; default = run number)"
        required: false
        type: string
      release_notes:
        description: "Optional release notes (markdown)"
        required: false
        type: string
      publish_sparkle_update:
        description: "Publish GitHub Release + appcast (needs SPARKLE_EDDSA_PRIVATE_KEY secret)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned Release Spotiglass.app
    # Pinned to the macos-26 (Tahoe) runner because Spotiglass and
    # SpotiglassTests both have a macOS 26.0 deployment target. The default
    # macos-latest label currently maps to macOS 15, whose host OS (15.7.x)
    # is older than the deployment target, so xcodebuild test refuses to
    # launch the test runner with: "My Mac's macOS 15.7.4 doesn't match
    # SpotiglassTests's macOS 26.0 deployment target." macos-26 went GA on
    # 2026-02-26 and includes Xcode 26.x by default.
    # See: https://github.com/actions/runner-images/issues/13739
    runs-on: macos-26
    timeout-minutes: 45
    env:
      PROJECT: Spotiglass.xcodeproj
      SCHEME: Spotiglass
      CONFIGURATION: Release
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      MARKETING_VERSION: ${{ inputs.marketing_version }}
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
      SPARKLE_VERSION: "2.7.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-path --sdk macosx
          xcrun --show-sdk-version --sdk macosx
          echo "Release version: ${MARKETING_VERSION} (${BUILD_NUMBER})"

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Run unit tests with coverage
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -parallel-testing-enabled NO \
            -enableCodeCoverage YES \
            -resultBundlePath "$GITHUB_WORKSPACE/build/ci-cov.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Per-file coverage gate (allowlisted ramp-up)
        run: |
          set -euo pipefail
          COVERAGE_ALLOWLIST=scripts/coverage-allowlist.json \
            ./scripts/check-coverage-per-file.sh "$GITHUB_WORKSPACE/build/ci-cov.xcresult"

      - name: Build unsigned Release Spotiglass.app
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Stage Spotiglass.app in artifact folder
        run: |
          set -euo pipefail
          APP_SOURCE="$DERIVED_DATA/Build/Products/$CONFIGURATION/Spotiglass.app"
          if [ ! -d "$APP_SOURCE" ]; then
            echo "Spotiglass.app not found at $APP_SOURCE" >&2
            ls -la "$DERIVED_DATA/Build/Products/$CONFIGURATION/" || true
            exit 1
          fi
          ARTIFACT_DIR="$GITHUB_WORKSPACE/artifact"
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          cp -R "$APP_SOURCE" "$ARTIFACT_DIR/Spotiglass.app"
          file "$ARTIFACT_DIR/Spotiglass.app/Contents/MacOS/Spotiglass"
          codesign -dv "$ARTIFACT_DIR/Spotiglass.app" 2>&1 || true

      - name: Upload Spotiglass.app artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: Spotiglass-release-app
          path: artifact/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

      - name: Prepare Sparkle update archive
        if: inputs.publish_sparkle_update
        run: |
          set -euo pipefail
          TAG="v${MARKETING_VERSION}"
          APP_SOURCE="$DERIVED_DATA/Build/Products/$CONFIGURATION/Spotiglass.app"
          ARCHIVES_DIR="$GITHUB_WORKSPACE/docs/sparkle-archives"
          mkdir -p "$ARCHIVES_DIR"
          ZIP_NAME="Spotiglass-${MARKETING_VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_SOURCE" "$ARCHIVES_DIR/$ZIP_NAME"

          if [ -n "${{ inputs.release_notes }}" ]; then
            NOTES_FILE="$GITHUB_WORKSPACE/docs/release-notes/${TAG}.md"
            mkdir -p "$(dirname "$NOTES_FILE")"
            printf '%s\n' "${{ inputs.release_notes }}" > "$NOTES_FILE"
            cp "$NOTES_FILE" "$ARCHIVES_DIR/Spotiglass-${MARKETING_VERSION}.md"
          fi

      - name: Install Sparkle release tools
        if: inputs.publish_sparkle_update
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/sparkle"
          curl -fsSL -o "$GITHUB_WORKSPACE/build/sparkle/Sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          tar -xf "$GITHUB_WORKSPACE/build/sparkle/Sparkle.tar.xz" -C "$GITHUB_WORKSPACE/build/sparkle"
          echo "SPARKLE_BIN=$GITHUB_WORKSPACE/build/sparkle/Sparkle-${SPARKLE_VERSION}/bin" >> "$GITHUB_ENV"

      - name: Generate appcast and sign update
        if: inputs.publish_sparkle_update
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_EDDSA_PRIVATE_KEY:-}" ]; then
            echo "::error::SPARKLE_EDDSA_PRIVATE_KEY secret is required when publish_sparkle_update is true."
            exit 1
          fi
          TAG="v${MARKETING_VERSION}"
          ARCHIVES_DIR="$GITHUB_WORKSPACE/docs/sparkle-archives"
          DOWNLOAD_PREFIX="https://github.com/isaaclins/spotiglass/releases/download/${TAG}/"
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_eddsa_private.key"
          "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file "$RUNNER_TEMP/sparkle_eddsa_private.key" \
            --download-url-prefix "$DOWNLOAD_PREFIX" \
            --embed-release-notes \
            -o "$GITHUB_WORKSPACE/docs/appcast.xml" \
            "$ARCHIVES_DIR"
          rm -f "$RUNNER_TEMP/sparkle_eddsa_private.key"

      - name: Create GitHub Release
        if: inputs.publish_sparkle_update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${MARKETING_VERSION}"
          ARCHIVES_DIR="$GITHUB_WORKSPACE/docs/sparkle-archives"
          NOTES_ARG=()
          if [ -n "${{ inputs.release_notes }}" ]; then
            NOTES_ARG=(--notes-file "$GITHUB_WORKSPACE/docs/release-notes/${TAG}.md")
          fi
          shopt -s nullglob
          ASSETS=("$ARCHIVES_DIR"/Spotiglass-"${MARKETING_VERSION}".zip "$ARCHIVES_DIR"/*.delta)
          gh release create "$TAG" "${ASSETS[@]}" --title "Spotiglass ${MARKETING_VERSION}" "${NOTES_ARG[@]}"

      - name: Publish appcast to docs (GitHub Pages)
        if: inputs.publish_sparkle_update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml docs/release-notes/ docs/sparkle-archives/ 2>/dev/null || true
          git add docs/appcast.xml docs/release-notes/ || true
          if git diff --staged --quiet; then
            echo "No appcast changes to commit."
            exit 0
          fi
          git commit -m "chore(release): Sparkle appcast for v${MARKETING_VERSION}"
          git push
