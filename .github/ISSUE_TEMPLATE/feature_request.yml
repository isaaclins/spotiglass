name: Feature request
description: Propose a new capability or an improvement to an existing one
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        One feature per issue, please. If you have a list of loosely related ideas, open one issue each so they can be discussed, sized and closed independently.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app would this touch?
      options:
        - lyrics
        - playlists
        - browsing / search
        - command palette
        - settings
        - equalizer (EQ)
        - playback
        - general / not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do today, and what gets in the way? Describe the situation, not the solution.
      placeholder: |
        When I want to ..., I currently have to ..., which means ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Spotiglass do instead? Describe the behaviour a user would see.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know this is done? List checkable statements.
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem, and why they are worse.

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / references
      description: Screenshots, sketches, or how another app solves this. Drag images right into this box.

  - type: input
    id: api
    attributes:
      label: Spotify API dependency
      description: If this needs a specific Spotify Web API or Web Playback SDK endpoint, name it (and link the docs).
      placeholder: e.g. GET /v1/recommendations

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Your honest guess at the size.
      options:
        - small (one view or one setting)
        - medium (new view or new service)
        - large (touches several subsystems)
        - no idea
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This is a single feature, not a bundle of unrelated ideas.
          required: true
        - label: I searched existing issues and this is not already requested.
          required: true
        - label: I would be willing to help implement this.
          required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else worth knowing.
